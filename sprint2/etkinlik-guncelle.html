<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle - Kampüs Etkinlikleri</title>
    <link rel="stylesheet" href="css/2211011030.css">
</head>
<body>
    <header>
        <a href="index.html">Kampüs Etkinlikleri</a>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html">Ekle</a>
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>
    <main>
        <h1>Etkinlik Güncelle</h1>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="ad">Etkinlik adı</label>
                <input type="text" id="ad" name="ad" value="Kariyer Günleri 2026">
            </div>
            <div class="form-group">
                <label for="kategori">Kategori</label>
                <select id="kategori" name="kategori">
                    <option value="">Seçiniz ▾</option>
                    <option value="seminer" selected>Seminer</option>
                    <option value="atolye">Atölye</option>
                    <option value="soylesi">Söyleşi</option>
                </select>
            </div>
            <div class="form-group">
                <label for="tarih">Tarih</label>
                <input type="date" id="tarih" name="tarih" value="2026-10-12">
            </div>
            <div class="form-group">
                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="3">Mezun söyleşileri</textarea>
            </div>
            <button type="submit">Güncelle</button>
        </form>
    </main>
</body>
</html>
